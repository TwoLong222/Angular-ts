<div class="search-container">
  <label for="searchInput" class="search-label">Tìm món:</label>
  <input 
    id="searchInput"
    type="search"
    class="search-input"
    [ngModel]="keyword()"
    (ngModelChange)="keyword.set($event)"
    placeholder="Nhập tên món hoặc mô tả..."
  />
  
 
  <div style="margin-top: 10px; display: flex; gap: 10px;">
    <button (click)="sortOrder.set('asc')">Giá tăng dần</button>
    <button (click)="sortOrder.set('desc')">Giá giảm dần</button>
    <button (click)="sortOrder.set('none')">Mặc định</button>
  </div>
</div>


<p style="font-weight: bold; color: var(--cam-dam);">
  Tìm thấy {{ resultCount() }} món
</p>


<ul class ="drink-grid">
  @for (drink of filteredDrinks(); track drink.id){
    <li>
      <a [routerLink]="['/drinks', drink.id]" class = "drink-btn">
          {{drink.name}}
      </a>
    </li>
  }@empty {
    <p class = "empty-message">Không tìm thấy món ăn nào khớp với từ khóa</p>
  }
</ul>
