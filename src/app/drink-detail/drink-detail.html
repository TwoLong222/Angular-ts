<mat-card style="max-width: 600px; margin: 24px auto; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.08);">
  
  
  <img mat-card-image [src]="drink.imgUrl" [alt]="drink.name" style="object-fit: cover; max-height: 300px; border-top-left-radius: 24px; border-top-right-radius: 24px;">

  <mat-card-header style="margin-top: 16px;">
    <mat-card-title style="font-size: 1.8rem; font-weight: 800;">{{ drink.name }}</mat-card-title>
    <mat-card-subtitle style="font-size: 1rem;">{{ drink.description }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content style="padding: 16px;">
    <p style="font-size: 1.4rem; font-weight: bold; color: var(--cam-dam); margin-top: 8px;">
      Giá: {{ drink.giaCoBan }}đ
    </p>
    
    
    <div style="display: flex; align-items: center; justify-content: center; gap: 24px; margin: 32px 0; padding: 16px; background: #f9fafb; border-radius: 16px;">
      <button mat-mini-fab color="accent" aria-label="Giảm số lượng" (click)="giamSoLy()" [disabled]="soLy() <= 1">
        <mat-icon>remove</mat-icon>
      </button>
      <span aria-live="polite" style="font-size: 1.5rem; font-weight: bold;">{{ soLy() }}</span>
      <button mat-mini-fab color="primary" aria-label="Tăng số lượng" (click)="tangSoLy()">
        <mat-icon>add</mat-icon>
      </button>
    </div>

    <p style="font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; color: #333; text-align: center;">
      Tổng giá: {{ tongTien() | number:'1.0-0' }}đ
    </p>

    <h3 style="margin-top: 24px; font-weight: bold; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px;">Topping</h3>
    <mat-list>
      
      <mat-list-item>
        <span matListItemTitle>Trân châu đen</span>
      </mat-list-item>
      <mat-list-item>
        <span matListItemTitle>Thạch trái cây</span>
      </mat-list-item>
    </mat-list>
  </mat-card-content>

  
  <mat-card-actions align="end" style="padding: 16px; border-top: 1px solid #f1f5f9;">
    
    <button mat-button color="warn" style="margin-right: auto;">Xóa món</button>
    
    <a mat-stroked-button routerLink="/drinks">
      <mat-icon>arrow_back</mat-icon> Quay lại
    </a>
  </mat-card-actions>

</mat-card>
